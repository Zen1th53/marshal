name: CI

on:
  pull_request:
  push:
    branches:
      - main
    # Documentation has its own workflow; a docs-only push does not rerun the
    # Go suite. Pull requests always run it because the gate is a required check.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'mkdocs.yml'
      - 'scripts/docs-*'

env:
  MARSHAL_CLOUD_ENDPOINT: 'off'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The race-instrumented suite in one job took about fifty minutes. Tests now
# run in parallel shards for both editions, and the slower race run lives in
# race.yml (weekly and on demand).

jobs:
  checks:
    name: Build, vet & pack
    # Ubuntu 24.04 hosted runners restrict the user namespaces required by bwrap.
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cryptography==49.0.0

      # tools/tests runs the clean-install smoke test, which asserts doctor
      # reports PASS. Without bwrap doctor degrades the sandbox check and exits
      # non-zero, so this job needs it as much as the execution tests do.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat
          bwrap --version
          command -v socat

      # The race jobs test the instrumented build; this proves the ordinary one
      # still compiles, which no test run here would otherwise check.
      - name: Build and vet
        run: |
          go build ./...
          go vet ./...
          go build -tags governed ./...

      - name: Validate pack and run Python test suites
        run: |
          python3 conformance/runner.py validate-pack
          python3 -m unittest discover -s conformance/tests -v
          python3 -m unittest discover -s tools/tests -v
          python3 -m unittest discover -s tools/tests_v6 -v
          python3 tools/release_verify.py . distribution/PACK-MANIFEST.json

      # internal/tui/wired.json is generated from the recorded Ctrl+N walk. It
      # must match its matrix, and no spec may fall from live to under
      # construction unless a task file names it.
      - name: Advanced menu wired status
        run: |
          if [ ! -d tasks ]; then
            echo "task specs are not part of this source release; wired status check skipped"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base=origin/${{ github.base_ref }}
          else
            base=HEAD~1
          fi
          if git show "$base:internal/tui/wired.json" > "$RUNNER_TEMP/wired-base.json" 2>/dev/null; then
            python3 tools/e2e/tui_walk.py wired --check --base "$RUNNER_TEMP/wired-base.json"
          else
            python3 tools/e2e/tui_walk.py wired --check
          fi

      - name: Validate diff whitespace
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check origin/${{ github.base_ref }}...HEAD
          else
            git diff --check HEAD~1...HEAD || true
          fi

  # Tests are split by a stable hash of the test name (tools/ci/test-shard.sh),
  # so the gate takes about as long as one shard instead of the whole suite.
  # Pushes and pull requests run the ordinary build of both editions; the race
  # detector is three to five times slower and runs weekly and on demand.
  test:
    name: Test — ${{ matrix.edition }} ${{ matrix.shard }}/6
    # Ubuntu 24.04 hosted runners restrict the user namespaces required by bwrap.
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        edition: [default, governed]
        shard: [0, 1, 2, 3, 4, 5]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat libevent-core-2.1-7
          bwrap --version
          command -v socat

      # The PTY tests need tmux 3.4; Ubuntu 22.04 ships 3.2a. Build it once and
      # keep the binary instead of compiling it in every job.
      - name: Cache tmux 3.4
        id: tmux-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.local/tmux
          key: tmux-3.4-${{ runner.os }}-ubuntu-22.04

      - name: Build tmux 3.4
        if: steps.tmux-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y libevent-dev ncurses-dev build-essential bison pkg-config
          curl -fsSL https://github.com/tmux/tmux/releases/download/3.4/tmux-3.4.tar.gz -o /tmp/tmux-3.4.tar.gz
          tar -xzf /tmp/tmux-3.4.tar.gz -C /tmp
          (cd /tmp/tmux-3.4 && ./configure --prefix="$HOME/.local/tmux" && make && make install)

      - name: Use tmux 3.4
        run: |
          echo "$HOME/.local/tmux/bin" >> "$GITHUB_PATH"
          "$HOME/.local/tmux/bin/tmux" -V | grep -q '3.4'

      # Marshal runs the isolated OpenCode adapter from a pinned offline
      # bootstrap. Preparation verifies every npm tarball against the lock's
      # SHA-512 integrity and the final tree against its pinned digest.
      - name: Prepare OpenCode offline bootstrap
        if: matrix.edition == 'default'
        run: python3 tools/prepare_opencode_bootstrap.py

      - name: Run test shard
        env:
          GO_TEST_TAGS: ${{ matrix.edition == 'governed' && 'governed' || '' }}
        run: tools/ci/test-shard.sh ${{ matrix.shard }} 6 -count=1 -timeout=35m

  verify:
    # The name branch protection requires. It carries no work of its own: it
    # fails if any job above failed, so the required check still means "the
    # whole gate passed" after the split.
    name: Runtime & Pack Verification
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    needs: [checks, test]
    if: always()

    steps:
      # Bracket notation, because a hyphen inside a property path is the
      # subtraction operator to the expression parser.
      - name: Report the gate
        env:
          CHECKS: ${{ needs.checks.result }}
          TESTS: ${{ needs.test.result }}
        run: |
          echo "checks: $CHECKS"
          echo "tests:  $TESTS"
          if [ "$CHECKS" != "success" ] || [ "$TESTS" != "success" ]; then
            echo "::error::one or more verification jobs did not pass"
            exit 1
          fi
