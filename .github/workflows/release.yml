name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Verify and publish Linux release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install release-gate dependencies
        run: |
          python -m pip install --disable-pip-version-check cryptography==49.0.0
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: Release gate
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -count=1 ./...
          go test -race -count=1 ./...
          go build ./...
          govulncheck ./...
          python3 conformance/runner.py validate-pack
          python3 -m unittest discover -s conformance/tests -v
          python3 -m unittest discover -s tools/tests -v
          python3 -m unittest discover -s tools/tests_v6 -v
          python3 tools/check_markdown_links.py .
          python3 tools/release_verify.py . distribution/PACK-MANIFEST.json
      - name: Build release assets
        env:
          SOURCE_DATE_EPOCH: ${{ github.event.repository.pushed_at }}
        run: |
          build_date=$(git show -s --format=%cI HEAD)
          tools/build_release.sh "${GITHUB_REF_NAME}" "${GITHUB_SHA}" "${build_date}" dist
          sha256sum -c --ignore-missing dist/checksums.txt
      - name: Attest build artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.json
            dist/checksums.txt
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: marshal-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "MARSHAL ${GITHUB_REF_NAME}" \
            --notes-file "release/RELEASE_NOTES_${GITHUB_REF_NAME#v}.md" \
            "${release_flags[@]}" \
            --verify-tag
