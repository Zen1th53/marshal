name: CodeQL Security Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Go Code
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9e8d398cdd9224f839c97d095945199671d1824a # v3.28.10
        with:
          languages: go

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9e8d398cdd9224f839c97d095945199671d1824a # v3.28.10
