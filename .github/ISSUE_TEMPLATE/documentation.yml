name: Documentation issue
description: Report inaccurate, missing, or broken MARSHAL documentation
title: "[Docs]: "
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: Page or link
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain what is inaccurate or missing and what the implementation does.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MARSHAL version or commit
    validations:
      required: true
