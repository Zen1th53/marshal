name: Feature Request
description: Propose a new feature, runtime capability, or enhancement for MARSHAL
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature to improve MARSHAL! Please describe your use case and proposal below.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement / Use Case
      description: What concrete engineering challenge, workflow limitation, or pain point does this solve?
      placeholder: e.g., When running multi-agent workflows, I need to...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution / Desired Behavior
      description: Describe how the new feature should work and its observable outcomes.
      placeholder: e.g., Add a new CLI command `marshal ...` or runtime policy rule that...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative designs, workarounds, or existing tools you have evaluated?
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any relevant diagrams, logs, CLI mockups, or references.
