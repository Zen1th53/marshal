name: Bug report
description: Report a reproducible MARSHAL defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not disclose vulnerabilities or secrets here. Follow SECURITY.md for private reporting.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal deterministic steps and relevant commands.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Version or commit
      description: Runtime version, pack version, or Git commit.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Go/Python version, adapter and sandbox details as relevant.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Sanitized logs, test output, or artifact references. Remove secrets and private data.
