site_name: Marshal
site_description: Plan work with one AI, let other AI agents do it, and stay in charge.
repo_url: https://github.com/Zen1th53/marshal
strict: true
docs_dir: docs
site_dir: site
# Public publication boundary: new files are excluded until explicitly reviewed.
exclude_docs: |
  /**
  !/index.md
  !/installation.md
  !/getting-started.md
  !/board-and-keys.md
  !/providers.md
  !/how-it-works.md
  !/memory-and-mcp.md
  !/configuration.md
  !/telemetry.md
  !/troubleshooting.md
  !/upgrading.md
  !/CHANGELOG.md
  !/stylesheets/marshal.css
theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
extra_css:
  - stylesheets/marshal.css
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
hooks:
  - scripts/docs-theme.py
plugins:
  - search
nav:
  - Home: index.md
  - Installation: installation.md
  - Getting started: getting-started.md
  - The Board and keys: board-and-keys.md
  - Providers: providers.md
  - How a run works: how-it-works.md
  - Memory and MCP: memory-and-mcp.md
  - Configuration: configuration.md
  - Telemetry: telemetry.md
  - Upgrading: upgrading.md
  - Troubleshooting: troubleshooting.md
  - Changelog: CHANGELOG.md
