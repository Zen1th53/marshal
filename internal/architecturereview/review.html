function openEditor(){targetRevision=state.revision;targetDigest=state.digest;targetUIDigest=state.ui_digest;targetLanguage=state.language;$('editor').hidden=false;$('request-type').value='comment';$('request-text').value='';$('result').textContent='';$('selection-meta').textContent=t('version')+' '+state.revision+(target.id?' · '+target.id:'');

function point(e){const p=$('diagram').createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform($('diagram').getScreenCTM().inverse());}
function rectangle(a,b){const l=layout(),x=Math.max(0,Math.min(l.width,Math.min(a.x,b.x))),y=Math.max(0,Math.min(l.height,Math.min(a.y,b.y)));return{x,y,width:Math.max(0,Math.min(l.width,Math.max(a.x,b.x))-x),height:Math.max(0,Math.min(l.height,Math.max(a.y,b.y))-y)};}
function intersectsBox(a,b){return a.x<=b.x+b.width&&a.x+a.width>=b.x&&a.y<=b.y+b.height&&a.y+a.height>=b.y;}
function intersectsLine(r,a,b){if(a[0]===b[0])return a[0]>=r.x&&a[0]<=r.x+r.width&&Math.max(a[1],b[1])>=r.y&&Math.min(a[1],b[1])<=r.y+r.height;return a[1]>=r.y&&a[1]<=r.y+r.height&&Math.max(a[0],b[0])>=r.x&&Math.min(a[0],b[0])<=r.x+r.width;}
$('diagram').onpointerdown=e=>{if(!areaMode||e.button!==0)return;if(!closeEditor())return;drag={start:point(e),pointer:e.pointerId};$('diagram').setPointerCapture(e.pointerId);};
$('diagram').onpointermove=e=>{if(!drag)return;selectionRect=rectangle(drag.start,point(e));mark();};
$('diagram').onpointerup=e=>{if(!drag||e.pointerId!==drag.pointer)return;selectionRect=rectangle(drag.start,point(e));drag=null;$('diagram').releasePointerCapture(e.pointerId);if(selectionRect.width<5||selectionRect.height<5){selectionRect=null;mark();return;}const l=layout();target={kind:'area',diagram_id:view,layout_version:l.version,rect:selectionRect,component_ids:l.nodes.filter(n=>intersectsBox(selectionRect,n)).map(n=>n.id),connection_ids:l.edges.filter(edge=>edge.points.slice(1).some((p,i)=>intersectsLine(selectionRect,edge.points[i],p))).map(edge=>edge.id)};setArea(false);openEditor();};
$('diagram').onpointercancel=()=>{drag=null;selectionRect=null;mark();};
function setArea(on){areaMode=on;$('area').setAttribute('aria-pressed',on);$('diagram').classList.toggle('area-mode',on);$('hint').textContent=on?t('area_hint'):t('view_hint');}
$('area').onclick=()=>{if(!closeEditor())return;setArea(!areaMode);};
function changeView(next){if(!closeEditor())return;notice('');view=next;setArea(false);for(const v of Object.keys(state.layouts))$(v)?.setAttribute('aria-pressed',v===view);draw();}
$('traffic').onclick=()=>changeView('traffic');$('marshal').onclick=()=>changeView('marshal');$('close').onclick=closeEditor;$('fit').onclick=()=>{const l=layout();$('diagram').setAttribute('viewBox',`0 0 ${l.width} ${l.height}`);};
document.onkeydown=e=>{if(e.key==='Escape'){if(closeEditor())setArea(false);}};
$('submit').onclick=async()=>{try{const text=$('request-text').value.trim();if(!text)throw Error(t('request_empty'));if(state.approved&&!confirm(t('reopen_prompt')))return;if(targetRevision!==state.revision||targetDigest!==state.digest||targetUIDigest!==state.ui_digest||targetLanguage!==state.language)throw Error(t('stale_selection'));$('submit').disabled=true;const bound=target.kind==='area'?{kind:'area',diagram_id:target.diagram_id,layout_version:target.layout_version,rect:target.rect}:{kind:target.kind,id:target.id,diagram_id:target.diagram_id,layout_version:target.layout_version};const prior=state.comments.find(c=>c.id===target.request_id);const followup=prior&&['failed','needs_clarification'].includes(prior.status)&&prior.request_type===$('request-type').value?{followup_to:prior.id}:{};const result=await api({action:'submit',revision:targetRevision,digest:targetDigest,target:bound,request_type:$('request-type').value,comment:text,...followup});state=result;target.request_id=state.comments.at(-1).id;$('request-text').value='';notice(t('submitted'));draw();showResults();}catch(e){notice(e.message,true);$('submit').disabled=false;}};
$('withdraw').onclick=async()=>{try{const prior=state.comments.find(c=>c.id===target?.request_id);if(!prior)return;state=await api({action:'withdraw',request_id:prior.id,reason:'Owner withdrew the browser request',revision:state.revision,digest:state.digest});$('request-text').value='';draw();showResults();notice(t('withdrawn'));}catch(e){notice(e.message,true);}};
$('approve').onclick=async()=>{try{if(acceptBlocker())throw Error(acceptBlocker());state=await api({action:'approve',revision:state.revision,digest:state.digest,builders_digest:state.builders_digest});draw();notice(t('approved_notice'));}catch(e){notice(e.message,true);}};
async function refresh(){try{const next=await api();const changed=state&&next.revision!==state.revision;const repaint=!state||JSON.stringify([state.revision,state.approved,state.comments,state.ui_digest,state.language,state.builders,state.accept_blocked])!==JSON.stringify([next.revision,next.approved,next.comments,next.ui_digest,next.language,next.builders,next.accept_blocked]);state=next;if(repaint)draw();showResults();if(target?.kind==='component'&&builders)renderBuilders(target.id);if(changed&&target)notice(t('updated_notice'));}catch(e){notice(e.message,true);}}
loadBuilders().catch(()=>{}).finally(()=>{refresh();setInterval(refresh,1500);});
</script></html>
