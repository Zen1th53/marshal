<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 1210" width="100%" height="100%" style="background-color:#0d0f12;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','SF Pro Text',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#6e7681"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#58a6ff"/></marker>
  </defs>
  <style>
    .title-main{fill:#fff;font-size:22px;font-weight:700;letter-spacing:-.3px}.title-sub{fill:#8b949e;font-size:13px}.meta-tag{fill:#8b949e;font-size:10px;font-weight:700;letter-spacing:.8px}.meta-val{fill:#6e7681;font-size:10px;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
    .sec-border{fill:none;stroke:#21262d;stroke-width:1}.sec-label{fill:#8b949e;font-size:10px;font-weight:700;letter-spacing:.8px}.card-bg{fill:#161b22;stroke:#30363d;stroke-width:1}.card-bg-sub{fill:#111418;stroke:#21262d;stroke-width:1}.node-h1{fill:#fff;font-size:12px;font-weight:600}.node-desc{fill:#8b949e;font-size:10px}.node-mono{fill:#8b949e;font-size:9.5px;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}.badge-source{fill:#58a6ff;font-size:8.5px;font-weight:700;font-family:ui-monospace,SFMono-Regular,monospace;letter-spacing:.5px}.badge-safe{fill:#3fb950;font-size:8.5px;font-weight:700;font-family:ui-monospace,SFMono-Regular,monospace;letter-spacing:.5px}.badge-warn{fill:#d29922;font-size:8.5px;font-weight:700;font-family:ui-monospace,SFMono-Regular,monospace;letter-spacing:.5px}.badge-block{fill:#f85149;font-size:8.5px;font-weight:700;font-family:ui-monospace,SFMono-Regular,monospace;letter-spacing:.5px}.wire{stroke:#484f58;stroke-width:1;fill:none}.wire-dash{stroke:#30363d;stroke-width:1;stroke-dasharray:3,3;fill:none}.wire-blue{stroke:#58a6ff;stroke-width:1;fill:none}.footer-text{fill:#6e7681;font-size:9.5px}
  </style>

  <!-- HEADER -->
  <text x="45" y="45" class="title-main">MARSHAL</text>
  <text x="45" y="64" class="title-sub">Implemented Runtime Architecture — current main code path</text>
  <text x="1315" y="42" class="meta-tag" text-anchor="end">SOURCE-FAITHFUL</text>
  <text x="1315" y="58" class="meta-val" text-anchor="end">runtime implementation 1.0.1 · SQLite schema v72 · source 42afa2c</text>

  <!-- 1 ENTRY POINTS -->
  <rect x="45" y="85" width="1270" height="92" class="sec-border" rx="4"/>
  <text x="55" y="100" class="sec-label">1 · ENTRY POINTS</text>
  <rect x="65" y="113" width="280" height="50" class="card-bg" rx="4"/>
  <text x="80" y="132" class="node-h1">marshal CLI</text><text x="80" y="147" class="node-desc">core commands use local daemon client</text><text x="80" y="159" class="node-mono">.marshal/runtime.sock</text>
  <rect x="375" y="113" width="280" height="50" class="card-bg" rx="4"/>
  <text x="390" y="132" class="node-h1">Web Control Plane</text><text x="390" y="147" class="node-desc">default 127.0.0.1:8787 · one-time login</text><text x="390" y="159" class="node-mono">opens canonical app.Runtime directly</text>
  <rect x="685" y="113" width="280" height="50" class="card-bg" rx="4"/>
  <text x="700" y="132" class="node-h1">MCP HTTP JSON-RPC</text><text x="700" y="147" class="node-desc">protocol 2026-07-28 · Bearer auth default</text><text x="700" y="159" class="node-mono">loopback default · rate/concurrency limited</text>
  <rect x="995" y="113" width="280" height="50" class="card-bg" rx="4"/>
  <text x="1010" y="132" class="node-h1">A2A HTTP/JSON</text><text x="1010" y="147" class="node-desc">wire 1.0 · protocol 1.0.0 · Bearer auth</text><text x="1010" y="159" class="node-mono">tasks · typed handoffs · task memory</text>

  <!-- 2 RUNTIME / CONTROL PLANE -->
  <rect x="45" y="188" width="1270" height="200" class="sec-border" rx="4"/>
  <text x="55" y="203" class="sec-label">2 · RUNTIME / CONTROL PLANE</text>
  <rect x="75" y="224" width="280" height="58" class="card-bg" rx="4"/>
  <text x="92" y="244" class="node-h1">Local daemon API</text><text x="92" y="260" class="node-mono">HTTP/JSON over runtime.sock</text><text x="92" y="273" class="node-desc">PID + socket guarded · socket expected mode 0600</text>
  <rect x="430" y="217" width="330" height="72" class="card-bg" rx="4"/>
  <text x="450" y="241" class="node-h1">internal/app.Runtime</text><text x="450" y="258" class="node-desc">canonical orchestration boundary</text><text x="450" y="274" class="node-mono">store · events · policy · capability · memory · gates</text>

  <rect x="820" y="214" width="210" height="48" class="card-bg-sub" rx="3"/>
  <text x="835" y="232" class="node-h1">Risk + Gate + Policy</text><text x="835" y="247" class="node-desc">AssessTool · GateEngine · authorizeRuntime</text>
  <rect x="1050" y="214" width="235" height="48" class="card-bg-sub" rx="3"/>
  <text x="1065" y="232" class="node-h1">Task / session lifecycle</text><text x="1065" y="247" class="node-desc">claim · lease · heartbeat · finalize</text>
  <rect x="820" y="272" width="210" height="48" class="card-bg-sub" rx="3"/>
  <text x="835" y="290" class="node-h1">Capability + Secrets</text><text x="835" y="305" class="node-desc">scoped grants · short secret leases</text>
  <rect x="1050" y="272" width="235" height="48" class="card-bg-sub" rx="3"/>
  <text x="1065" y="290" class="node-h1">Memory + Handoffs + Quorum</text><text x="1065" y="305" class="node-desc">MemoryService · protocol.Service · quorum.Engine</text>
  <rect x="820" y="330" width="465" height="38" class="card-bg-sub" rx="3"/>
  <text x="835" y="347" class="node-h1">Canonical state + events</text><text x="1048" y="347" class="node-desc">SQLite store · events.Engine · audit-linked persistence</text>

  <!-- 3 RUNTIME.RUN -->
  <rect x="45" y="400" width="940" height="230" class="sec-border" rx="4"/>
  <text x="55" y="415" class="sec-label">3 · RUNTIME.RUN — ACTUAL EXECUTION PATH</text>
  <rect x="65" y="434" width="265" height="68" class="card-bg" rx="4"/>
  <text x="80" y="454" class="node-h1">Pre-execution authorization</text><text x="80" y="470" class="node-desc">risk.AssessTool -&gt; GateEngine</text><text x="80" y="484" class="node-desc">authorizeRuntime -&gt; policy.Enforce</text><text x="80" y="496" class="node-mono">shell.execute + filesystem.read/write</text>
  <rect x="360" y="434" width="265" height="68" class="card-bg" rx="4"/>
  <text x="375" y="454" class="node-h1">Claim + execution state</text><text x="375" y="470" class="node-desc">session + 15m task lease</text><text x="375" y="484" class="node-desc">worktree.Prepare on marshal/&lt;task&gt;</text><text x="375" y="496" class="node-mono">BeginExecution state persistence</text>
  <rect x="655" y="434" width="305" height="68" class="card-bg" rx="4"/>
  <text x="670" y="454" class="node-h1">Automatic task-start memory recall</text><text x="670" y="470" class="node-desc">MemoryService.Recall -&gt; trusted context</text><text x="670" y="484" class="node-desc">scope-authorized retrieval from SQLite</text><text x="670" y="496" class="node-mono">max 8 records · 12 KiB context budget</text>

  <rect x="65" y="525" width="265" height="88" class="card-bg" rx="4"/>
  <text x="80" y="545" class="node-h1">resolveAdapter + Probe</text><text x="80" y="561" class="node-desc">find external CLI · resolve symlink</text><text x="80" y="576" class="node-desc">issue exact-binary shell-exec grant</text><text x="80" y="590" class="node-mono">30m scoped grant · revoked after run</text><text x="80" y="604" class="node-desc">Adapter.Probe captures CLI version</text>
  <rect x="360" y="525" width="265" height="88" class="card-bg" rx="4"/>
  <text x="375" y="545" class="node-h1">ProcessRunner + isolation choice</text><text x="375" y="561" class="node-desc">worker.New · timeout/cancel · 8 MiB bound</text><text x="375" y="576" class="node-desc">Bubblewrap (bwrap) mount namespace</text><text x="375" y="590" class="node-mono">ro root · tmpfs dirs · --unshare-net</text><text x="375" y="604" class="node-desc">process-only fallback requires explicit opt-in</text>
  <rect x="655" y="525" width="305" height="88" class="card-bg" rx="4"/>
  <text x="670" y="545" class="node-h1">Provider execution</text><text x="670" y="561" class="node-desc">Adapter.Run in dedicated worktree</text><text x="670" y="576" class="node-desc">background heartbeat every 5s</text><text x="670" y="590" class="node-desc">short env-secret leases + post-run redaction</text><text x="670" y="604" class="node-mono">task execution boundary isolation</text>

  <!-- VERIFY API -->
  <rect x="1005" y="400" width="310" height="230" class="sec-border" rx="4"/>
  <text x="1015" y="415" class="sec-label">SEPARATE VERIFICATION API</text>
  <rect x="1025" y="434" width="270" height="98" class="card-bg" rx="4"/>
  <text x="1040" y="454" class="node-h1">Runtime.Verify</text><text x="1040" y="472" class="node-mono">CLI: marshal verify [-- cmd args...]</text><text x="1040" y="488" class="node-desc">authorizeRuntime(verify)</text><text x="1040" y="504" class="node-desc">worker.New → exact argv in repo root</text><text x="1040" y="520" class="node-desc">returns exit status + SHA-256 digest</text>
  <rect x="1025" y="542" width="270" height="71" class="card-bg-sub" rx="3"/>
  <text x="1040" y="560" class="node-h1">Important boundary</text><text x="1040" y="576" class="node-desc">Verify is an explicit standalone API.</text><text x="1040" y="590" class="node-desc">It is not an automatic post-provider run stage.</text><text x="1040" y="604" class="node-desc">Quorum is a configurable gate, not linear.</text>

  <!-- 4 PROVIDER PROCESSES -->
  <rect x="45" y="642" width="1270" height="88" class="sec-border" rx="4"/>
  <text x="55" y="657" class="sec-label">4 · PROVIDER ADAPTERS / EXTERNAL PROCESSES</text>
  <rect x="65" y="670" width="285" height="46" class="card-bg" rx="4"/><text x="80" y="690" class="node-h1">codex CLI</text><text x="80" y="705" class="badge-source">ADAPTER IMPLEMENTED IN SOURCE</text>
  <rect x="380" y="670" width="285" height="46" class="card-bg" rx="4"/><text x="395" y="690" class="node-h1">gemini CLI</text><text x="395" y="705" class="badge-source">ADAPTER IMPLEMENTED IN SOURCE</text>
  <rect x="695" y="670" width="285" height="46" class="card-bg" rx="4"/><text x="710" y="690" class="node-h1">claude CLI</text><text x="710" y="705" class="badge-source">ADAPTER IMPLEMENTED IN SOURCE</text>
  <rect x="1010" y="670" width="285" height="46" class="card-bg" rx="4"/><text x="1025" y="690" class="node-h1">opencode CLI</text><text x="1025" y="705" class="badge-source">ADAPTER IMPLEMENTED IN SOURCE</text>

  <!-- 5 RESULT / EVIDENCE -->
  <rect x="45" y="742" width="1270" height="202" class="sec-border" rx="4"/>
  <text x="55" y="757" class="sec-label">5 · RESULT HANDLING · EVIDENCE · COMPLETION MEMORY</text>
  <text x="670" y="770" class="node-desc" text-anchor="middle">all four adapters return the same adapter.Result path</text>
  <rect x="65" y="784" width="280" height="58" class="card-bg" rx="4"/><text x="80" y="804" class="node-h1">Inspect + commit task worktree</text><text x="80" y="820" class="node-desc">dirty changes commit under policy</text><text x="80" y="834" class="node-desc">reject success with no new commit · 500 MiB budget</text>
  <rect x="375" y="784" width="280" height="58" class="card-bg" rx="4"/><text x="390" y="804" class="node-h1">sanitizeProviderOutput + artifacts</text><text x="390" y="820" class="node-desc">bounded sanitizer after secret-value redaction</text><text x="390" y="834" class="node-desc">stdout/stderr -&gt; SHA-256 content-addressed artifacts</text>
  <rect x="685" y="784" width="280" height="58" class="card-bg" rx="4"/><text x="700" y="804" class="node-h1">recordRunEvidence</text><text x="700" y="820" class="node-desc">command · output · environment evidence</text><text x="700" y="834" class="node-desc">provider version + base/result commit linkage</text>
  <rect x="995" y="784" width="280" height="58" class="card-bg" rx="4"/><text x="1010" y="804" class="node-h1">FinishRun</text><text x="1010" y="820" class="node-desc">persist status · result commit · artifact refs</text><text x="1010" y="834" class="node-desc">success/failure/timeout/cancelled/blocked</text>
  <rect x="280" y="866" width="500" height="54" class="card-bg-sub" rx="3"/>
  <text x="295" y="886" class="node-h1">MemoryService.CaptureOutcome -&gt; ProposeOutcomeConsolidation</text><text x="295" y="903" class="node-desc">provider-neutral evidence-linked candidate; no raw provider reasoning captured by this path</text>
  <rect x="820" y="866" width="360" height="54" class="card-bg-sub" rx="3"/>
  <text x="835" y="886" class="node-h1">ObserveHEAD -&gt; FinalizeExecution</text><text x="835" y="903" class="node-desc">advance task head only after successful committed result</text>

  <!-- 6 MEMORY FABRIC -->
  <rect x="45" y="956" width="1270" height="112" class="sec-border" rx="4"/>
  <text x="55" y="971" class="sec-label">6 · CANONICAL MEMORY FABRIC (MemoryService v2.0.0)</text>
  <rect x="65" y="986" width="225" height="62" class="card-bg" rx="4"/><text x="80" y="1006" class="node-h1">Durable memory records</text><text x="80" y="1022" class="node-desc">ACL authorization · lifecycle</text><text x="80" y="1036" class="node-desc">conflict detection · governed writes</text>
  <rect x="310" y="986" width="225" height="62" class="card-bg" rx="4"/><text x="325" y="1006" class="node-h1">Retrieval projections</text><text x="325" y="1022" class="node-desc">lexical index + graph index + cache</text><text x="325" y="1036" class="node-desc">vector optional only with real embedder</text>
  <rect x="555" y="986" width="225" height="62" class="card-bg" rx="4"/><text x="570" y="1006" class="node-h1">Working/task memory</text><text x="570" y="1022" class="node-desc">task slots · CAS updates</text><text x="570" y="1036" class="node-desc">private slots + provenance fields</text>
  <rect x="800" y="986" width="225" height="62" class="card-bg" rx="4"/><text x="815" y="1006" class="node-h1">Cross-agent surfaces</text><text x="815" y="1022" class="node-desc">typed handoffs via protocol.Service</text><text x="815" y="1036" class="node-desc">A2A + MCP memory routes/tests</text>
  <rect x="1045" y="986" width="250" height="62" class="card-bg" rx="4"/><text x="1060" y="1006" class="node-h1">Automatic runtime integration</text><text x="1060" y="1022" class="node-desc">Recall before provider execution</text><text x="1060" y="1036" class="node-desc">CaptureOutcome after evidence persistence</text>

  <!-- 7 OPERATIONS + PERSISTENCE -->
  <rect x="45" y="1080" width="1270" height="86" class="sec-border" rx="4"/>
  <text x="55" y="1095" class="sec-label">7 · OPERATIONS + CANONICAL LOCAL PERSISTENCE</text>
  <rect x="65" y="1110" width="370" height="42" class="card-bg" rx="4"/><text x="80" y="1127" class="node-h1">SQLite v72 — .marshal/state.db</text><text x="80" y="1142" class="node-desc">canonical live coordination state</text>
  <rect x="455" y="1110" width="390" height="42" class="card-bg" rx="4"/><text x="470" y="1127" class="node-h1">Doctor + Resource Awareness</text><text x="470" y="1142" class="node-desc">CPU/RAM/storage/accelerators/Ollama · advisory only</text>
  <rect x="865" y="1110" width="430" height="42" class="card-bg" rx="4"/><text x="880" y="1127" class="node-h1">Live Web surfaces are bounded</text><text x="880" y="1142" class="node-desc">status/resources/doctor/backups + selected memory paths</text>

  <!-- FOOTER -->
  <text x="45" y="1192" class="footer-text">Source truth used: current main Go code, not README/roadmap claims. Runtime spec 1.0.0; runtime implementation 1.0.1; SQLite schema v72; pack 6.0.0.</text>
  <text x="1315" y="1192" class="footer-text" text-anchor="end">No active adaptive-governor / fleet-placement / autonomous-optimizer path was verified in current Community main.</text>

